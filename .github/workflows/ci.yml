name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC x64)
            os: windows-latest
            preset: win-release
          - name: macOS (universal)
            os: macos-latest
            preset: mac-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: DSP tests
        run: ctest --preset ${{ matrix.preset }}

      - name: pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/pluginval.ps1 -Preset ${{ matrix.preset }} -SkipGui

      - name: pluginval (macOS, VST3 + AU)
        if: runner.os == 'macOS'
        run: bash tools/pluginval.sh ${{ matrix.preset }} 10 --skip-gui

      - name: auval (Logic compatibility)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/${{ matrix.preset }}/plugin/Augur5_artefacts/Release/AU/AUGUR-5.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Au53 Augr

      - name: Upload plugin binaries
        uses: actions/upload-artifact@v4
        with:
          name: AUGUR-5-${{ runner.os }}
          path: |
            build/${{ matrix.preset }}/plugin/Augur5_artefacts/Release/VST3
            build/${{ matrix.preset }}/plugin/Augur5_artefacts/Release/AU
            build/${{ matrix.preset }}/plugin/Augur5_artefacts/Release/Standalone
          if-no-files-found: ignore
