name: CI

on:
  push:
  pull_request:

permissions:
  contents: write # publish releases for version tags

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC x64)
            os: windows-latest
            preset: win-release
          - name: macOS (universal)
            os: macos-latest
            preset: mac-release

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        shell: bash
        run: |
          grep -E "error( C[0-9]+)?:" build.log | head -n 20 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: DSP tests
        run: ctest --preset ${{ matrix.preset }}

      - name: Factory library audit (every preset through the real processor)
        shell: bash
        run: |
          AUDIT=$(find build/${{ matrix.preset }}/plugin -name 'augur_preset_audit' -type f -perm -u+x 2>/dev/null | head -1)
          [ -z "$AUDIT" ] && AUDIT=$(find build/${{ matrix.preset }}/plugin -name 'augur_preset_audit.exe' | head -1)
          "$AUDIT"

      - name: pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/pluginval.ps1 -Preset ${{ matrix.preset }} -SkipGui

      - name: pluginval (macOS, VST3 + AU, installs the AU)
        if: runner.os == 'macOS'
        run: bash tools/pluginval.sh ${{ matrix.preset }} 10 --skip-gui

      - name: auval (Logic compatibility)
        if: runner.os == 'macOS'
        run: auval -v aumu Au53 Tnlb

      - name: macOS installer (.pkg)
        if: runner.os == 'macOS'
        run: bash installer/mac/build_pkg.sh ${{ matrix.preset }}

      - name: Windows package (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(AUGUR5 VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $art = "build/${{ matrix.preset }}/plugin/Augur5_artefacts/Release"
          New-Item -ItemType Directory -Force build/installer | Out-Null
          Compress-Archive -Path "$art/VST3/AUGUR-5.vst3", "$art/Standalone/AUGUR-5.exe" -DestinationPath "build/installer/AUGUR-5 $version (Windows).zip" -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AUGUR-5-${{ runner.os }}-installer
          path: |
            build/installer/*.pkg
            build/installer/*.zip
          if-no-files-found: error

      - name: Publish release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/installer/*.pkg
            build/installer/*.zip
          body: |
            AUGUR-5 "3340" by TONAL LAB.
            macOS: open the .pkg (universal, macOS 11+). First time: System Settings > Privacy & Security > Open Anyway.
            Windows: unzip and copy AUGUR-5.vst3 to C:\Program Files\Common Files\VST3.

      - name: Upload plugin binaries
        uses: actions/upload-artifact@v4
        with:
          name: AUGUR-5-${{ runner.os }}
          path: |
            build/${{ matrix.preset }}/plugin/Augur5_artefacts/Release/VST3
            build/${{ matrix.preset }}/plugin/Augur5_artefacts/Release/AU
            build/${{ matrix.preset }}/plugin/Augur5_artefacts/Release/Standalone
          if-no-files-found: ignore
